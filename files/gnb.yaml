# This example configuration outlines how to configure the OCUDU gNB to create a single TDD cell
# transmitting in band 78, with 20 MHz bandwidth and 30 kHz sub-carrier-spacing. A USRP B200 is configured
# as the RF frontend using split 8. Note in this example an external clock source is not used, so the sync
# is not defined and the default is used.

cu_cp:
  inactivity_timer: 7200
  amf:
    addrs: 10.0.0.10
    port: 38412
    bind_addrs: 10.0.0.20
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=512,num_send_frames=512,master_clock_rate=23.04e6
  srate: 23.04
  clock: external
  sync: external
  otw_format: sc12
  tx_gain: 89.75                       # device max
  rx_gain: 60                          # swept at Loc 1 2026-08-02: 70 -> OVL, 63 -> OVL, 60 -> clean, PHR -1/0

cell_cfg:
  dl_arfcn: 627340
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5
    nof_dl_slots: 2
    nof_dl_symbols: 5
    nof_ul_slots: 2
    nof_ul_symbols: 5
  # pcg_p_nr_fr1: -15                    # was capping UE tx power ~38 dB below normal; disabled for corrected campaign
  q_rx_lev_min: -70
log:
  filename: /tmp/gnb.log
  all_level: info
  hex_max_size: 0

pcap:
  mac_enable: true
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: true
  ngap_filename: /tmp/gnb_ngap.pcap
